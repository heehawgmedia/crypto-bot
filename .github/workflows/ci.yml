name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quant-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy quant_lab
      - run: pytest -q

  ts-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
