[project]
name = "quant-lab"
version = "0.1.0"
description = "Crypto strategy research and execution pipeline: backtest -> walk-forward -> paper -> capped live"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.4",
]

[project.scripts]
quant-lab = "quant_lab.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quant_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
