mode: paper                     # paper | live | research; paper is the default everywhere

exchanges:
  kraken:
    taker_fee_bps: 26
    maker_fee_bps: 16
    rate_limit_ms: 1000
  coinbase:
    taker_fee_bps: 60
    maker_fee_bps: 40
    rate_limit_ms: 400
  # API keys are NEVER stored here — environment variables only (see .env.example)

data:
  # History is fetched from coinbase: its API paginates the full history,
  # while Kraken's only serves the most recent ~720 candles. Trading still
  # happens on kraken (see the strategy YAMLs) with kraken's fees.
  exchange: coinbase
  symbols: [BTC/USD, ETH/USD]
  timeframes: [1h, 4h, 1d]
  start_date: "2016-01-01"     # coinbase serves BTC/USD from ~2015, ETH/USD from ~2016;
                               # more history = more out-of-sample evidence for slow strategies
  parquet_dir: data/parquet
  max_gap_bars: 3

backtest:
  slippage_bps: 10
  initial_capital_usd: 10000
  execution: next_bar_open      # the only allowed value in v1

walkforward:
  in_sample_bars: 4380          # ~6 months of 1h bars
  out_of_sample_bars: 1460      # ~2 months
  step_bars: 1460               # roll by the OOS width — no OOS overlap
  min_windows: 4
  optimize_metric: sharpe

promotion:
  min_oos_trades: 30            # hard floor; config values below 30 fail validation
  min_paper_days: 56
  min_oos_sharpe: 0.5           # extra bar: stitched OOS Sharpe must be >= this.
                                # Raised from 0.0 after a break-even strategy
                                # (Sharpe 0.18, net -0.6% over 5 years) slipped
                                # through — "eligible" should mean "worth papering".

risk:
  max_capital_usd: null         # REQUIRED (set by you) before mode can be live; no default
  max_positions: 3
  per_strategy_capital_frac: 0.5
  kill_switches:
    max_daily_loss_pct: 3.0
    max_drawdown_pct: 10.0
    max_consecutive_api_errors: 5
    flatten_on_trip: false

vault:
  enabled: true                 # move a slice of each winning trade's profit out of
  skim_pct: 15.0                # trading capital into the vault (see: quant-lab vault)

alerts:
  telegram:
    enabled: false              # token/chat id from env: QL_TELEGRAM_BOT_TOKEN / QL_TELEGRAM_CHAT_ID
    on_fill: true
    on_kill_switch: true
  discord:
    enabled: false              # webhook from env: QL_DISCORD_WEBHOOK_URL
    on_fill: true
    on_kill_switch: true

audit:
  sqlite_path: data/quantlab.db

dashboard:
  host: 127.0.0.1               # loopback only: the dashboard can start/stop trading.
  port: 8787                    # changing this to 0.0.0.0 exposes those buttons to your LAN.
